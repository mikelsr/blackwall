[workspace]
resolver = "3"
members = [
    "challenge",
    "challenge-wasm",
    "cli",
    "shared",
    "proxy",
]

[workspace.package]
name = "b7l"
version = "0.1.0"
authors = ["Mikel Solabarrieta"]
description = "A Rust re-implementation of Anubis."
edition = "2024"
homepage = "https://b7l.net"
readme = "README.md"

[workspace.dependencies]
tracing = { version = "0.1.41", features = ["attributes", "release_max_level_info"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
