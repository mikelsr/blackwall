[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "blackwall"
path = "src/main.rs"

[dependencies]
proxy = { path = "../proxy" }
shared = { path = "../shared" }

axum = "0.8.8"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "signal"] }
clap = { version = "4.5.60", features = ["derive", "env"] }
dotenvy = "0.15.7"
rustls = "0.23.37"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { version = "0.13.2", features = ["rustls"] }
humantime = "2.3.0"
dhat = { version = "0.3.3", optional = true }

[features]
dhat-heap = ["dep:dhat"]
