<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackwall</title>
<script><!--B7L_INJECTION--></script>
<!-- Blackwall's challenge page: the solver's progress over a corridor of pink dots running to a vanishing point behind the text, after the Blackwall in Cyberpunk 2077. -->
<style>
html, body { height: 100%; margin: 0; }
body {
    display: flex;
    align-items: center;
    font-family: Bahnschrift, 'DIN Condensed', Futura, 'Avenir Next Condensed', 'Arial Narrow', sans-serif;
    color: #a8324f;
    /* A red haze rising from the floor; the canvas draws the wall over it. */
    background: radial-gradient(ellipse 80% 40% at 70% 100%, rgba(150, 12, 40, .4), transparent) #060308;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; opacity: 0; transition: opacity .6s; }
/* A soft dark halo behind the text, so it reads where the wall reaches it. */
main { position: relative; z-index: 0; }
main::before { content: ""; position: absolute; inset: -48px -32px; z-index: -1; background: radial-gradient(closest-side, rgba(6, 3, 8, .85), transparent); }
.error { color: #ff7a90; letter-spacing: .05em; }
:root {
    /* The text's palette: the title, the bar and percentage (as r, g, b),
       the status line, and the dimmer meta line. */
    --title: #ff2a5a;
    --accent: 255, 42, 90;
    --text: #a8324f;
    --dim: #7c2840;
}
body {
    color: var(--text);
    justify-content: center;
    background: radial-gradient(ellipse 90% 40% at 50% 100%, rgba(150, 12, 40, .4), transparent) #060308;
}
main { display: flex; flex-direction: column; align-items: center; padding: 0 16px; }
main::before { inset: -64px -48px; }
h1 {
    margin: 0;
    /* Letter spacing trails the last letter too; this pad evens it out. */
    padding-left: .17em;
    font-size: clamp(28px, 7vw, 44px);
    font-weight: 800;
    letter-spacing: .17em;
    text-transform: uppercase;
    color: var(--title);
    text-shadow: 0 0 18px rgba(var(--accent), .55);
}
/* Thin vertical slats, dim, with the filled part bright. */
.bar, .row { width: min(340px, 64vw); }
.bar {
    position: relative;
    height: 8px;
    margin-top: 22px;
    background: repeating-linear-gradient(90deg, rgba(var(--accent), .2) 0 3px, transparent 3px 5px);
}
.bar i {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    background: repeating-linear-gradient(90deg, rgb(var(--accent)) 0 3px, transparent 3px 5px);
    filter: drop-shadow(0 0 4px rgba(var(--accent), .8));
    transition: width .1s linear;
}
/* Solved: the bar snaps full, as the page leaves right away. */
.done .bar i {
    transition: none;
    background: repeating-linear-gradient(90deg, #5ef6ff 0 3px, transparent 3px 5px);
    filter: drop-shadow(0 0 4px rgba(94, 246, 255, .8));
}
/* A fixed height, so the block doesn't shift when the numbers appear. */
.row { display: flex; justify-content: space-between; align-items: baseline; height: 18px; margin-top: 10px; font-size: 12px; letter-spacing: .3em; }
.row b { font-size: 15px; font-weight: normal; color: rgb(var(--accent)); letter-spacing: .1em; }
.row.meta { margin-top: 6px; color: var(--dim); }
.done .row:not(.meta), .done .row b { color: #5ef6ff; }
body { background: radial-gradient(circle at 50% 50%, rgba(150, 12, 60, .14), transparent 50%) #070309; }
:root { --title: #ff4a78; --accent: 255, 70, 130; --text: #c2507c; --dim: #86335a; }
</style>
</head>
<body>
<canvas></canvas>
<main id="main">
    <h1>Blackwall</h1>
    <div class="bar"><i id="fill"></i></div>
    <div class="row"><span id="status">VERIFYING</span><b id="pct">0%</b></div>
    <div class="row meta"><span id="threads"></span><span id="time">0.00s</span></div>
    <noscript><p class="error">Enable JavaScript to continue.</p></noscript>
</main>
<script id="wall" type="text/plain">
// The background, drawn in a worker on the page's canvas, which the page
// hands over with the window's size, and again with a new size on resize.
// Off the page's main thread, drawing never holds up the challenge.
// Seeded, so it looks the same on every visit. The text sits in the middle
// of the screen; each background keeps that spot dark.
let canvas;
onmessage = function (e) {
    const { w, h, dpr } = e.data;
    if (e.data.canvas) canvas = e.data.canvas;
    let seed = 7;
    const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const layer = new OffscreenCanvas(w * dpr, h * dpr);
    const g = layer.getContext('2d');
    g.scale(dpr, dpr);
    g.globalCompositeOperation = 'lighter';

    // Dim red, hot pink, near white.
    const color = (t, a) => t < .5
        ? `rgba(${90 + 236 * t | 0},${6 + 20 * t | 0},${20 + 76 * t | 0},${a})`
        : `rgba(255,${16 + 196 * (t - .5) | 0},${58 + 340 * (t - .5) | 0},${a})`;
    const dot = (x, y, r, fill) => { g.fillStyle = fill; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); };
    // A 1 px wide line from y0 to y1, fading out toward y1.
    const streak = (x, y0, y1, rgb, a) => {
        const grad = g.createLinearGradient(0, y0, 0, y1);
        grad.addColorStop(0, `rgba(${rgb},${a})`);
        grad.addColorStop(1, `rgba(${rgb},0)`);
        g.fillStyle = grad;
        g.fillRect(x, Math.min(y0, y1), 1, Math.abs(y1 - y0));
    };

    // A corridor seen from inside, like the AIs' cave around Alt: two lumpy
    // walls of dots run off to a vanishing point behind the text and fade
    // with distance.
    // On tall screens it turns on its side: the walls go above and below
    // the text, where a phone has room for them.
    const tall = h > w, L = Math.max(w, h), cx = L / 2, cy = Math.min(w, h) / 2;
    // F sizes the corridor so its nearest slice spans the long side.
    const F = L * .5, ry = .75;
    // Slices about 3 px apart on screen, each sampled about every 3 px.
    for (let z = .8; z < 8; z += 3 * z * z / F) {
        const fog = Math.exp(-(z - .8) / 1.6);
        const ring = Math.ceil(F * 2 * Math.PI * 1.2 / (3 * z));
        for (let i = 0; i < ring; i++) {
            const a = 2 * Math.PI * (i + rand()) / ring;
            // Sides only: the ceiling and floor stay open.
            if (Math.abs(Math.cos(a)) < .3) continue;
            const lump = .22 * Math.sin(2 * a + z * .7) + .12 * Math.sin(5 * a - z * 1.6) + .05 * Math.sin(13 * a + z * 3.1);
            const u = cx + F * Math.cos(a) * (1 + lump) / z, v = cy + F * ry * Math.sin(a) * (1 + lump) / z;
            const sx = tall ? v : u, sy = tall ? u : v;
            if (sx < -4 || sx > w + 4 || sy < -4 || sy > h + 4) continue;
            // Bulges catch the light; hollows fall dark.
            const lit = Math.max(0, Math.min(1, .35 + 2.5 * lump)) ** 2;
            if (rand() > .03 + .7 * lit) continue;
            const t = lit * fog * (.6 + .5 * rand());
            const r = Math.min(1.8, .3 + .9 / z) * (.6 + .6 * t);
            dot(sx, sy, r, color(.15 + .85 * t, .35 + .6 * t));
            if (rand() < .006 * fog) streak(sx, sy, sy + 20 + 120 * rand(), '255,60,110', .25 * fog);
        }
    }

    // A soft glow under the sharp dots.
    canvas.width = layer.width;
    canvas.height = layer.height;
    const out = canvas.getContext('2d');
    out.globalCompositeOperation = 'lighter';
    out.filter = 'blur(10px)';
    out.globalAlpha = .7;
    out.drawImage(layer, 0, 0);
    out.filter = 'none';
    out.globalAlpha = 1;
    out.drawImage(layer, 0, 0);
    postMessage('drawn');
};
</script>
<script>
(function () {
    // ===== The background =====
    // Drawn by a worker (the code above) on the canvas, so it never holds up
    // the challenge, then faded in. Without OffscreenCanvas, the page keeps
    // its plain gradient.
    const canvas = document.querySelector('canvas');
    if (canvas.transferControlToOffscreen) {
        const code = new Blob([document.getElementById('wall').textContent], { type: 'application/javascript' });
        const painter = new Worker(URL.createObjectURL(code));
        const size = () => ({ w: innerWidth, h: innerHeight, dpr: Math.min(devicePixelRatio || 1, 2) });
        const offscreen = canvas.transferControlToOffscreen();
        painter.postMessage({ canvas: offscreen, ...size() }, [offscreen]);
        painter.onmessage = () => { canvas.style.opacity = 1; };
        let resizing;
        addEventListener('resize', () => { clearTimeout(resizing); resizing = setTimeout(() => painter.postMessage(size()), 150); });
    }

    // ===== The status panel =====
    const $ = id => document.getElementById(id);
    const ui = {
        ready(count) { $('threads').textContent = count + (count === 1 ? ' THREAD' : ' THREADS'); },
        tick(progress, s) {
            $('fill').style.width = (100 * progress).toFixed(1) + '%';
            $('pct').textContent = Math.floor(100 * progress) + '%';
            $('time').textContent = s.toFixed(2) + 's';
        },
        found(worker, s) {
            ui.tick(1, s);
            $('main').className = 'done';
            $('status').textContent = 'VERIFIED';
        },
        error(text) { $('status').textContent = text; $('status').className = 'error'; },
    };

    // ===== The challenge =====
    // Runs the solver in workers and reports to `ui`:
    //   ready(count)        every worker loaded the solver
    //   tick(progress, s)   every 100 ms while solving: estimated progress 0-1, seconds
    //   found(worker, s)    a worker found the nonce; the page redirects next
    //   error(text)
    // The progress is an estimate: a solve takes about 16^difficulty hashes
    // (difficulty counts leading zero hex digits), at an assumed rate per
    // worker. It stays under 99% until a worker finds the nonce.
    const HASHES_PER_SECOND = 7e6;

    // Worker code, as a string for a Blob URL: the WASM bindings for solve().
    const workerCode = `
        let wasm = null, memory = null, length = 0;
        function bytes() {
            if (memory === null || memory.byteLength === 0) memory = new Uint8Array(wasm.memory.buffer);
            return memory;
        }
        function pass(array) {
            const ptr = wasm.__wbindgen_export(array.length, 1) >>> 0;
            bytes().set(array, ptr);
            length = array.length;
            return ptr;
        }
        function solve(randomData, difficulty, startNonce, step) {
            memory = null;
            const ptr = pass(randomData);
            return BigInt.asUintN(64, wasm.solve(ptr, length, difficulty, startNonce, step));
        }
        self.onmessage = async function (e) {
            const { type, workerId, wasmUrl, randomData, difficulty, startNonce, step } = e.data;
            try {
                if (type === 'init') {
                    const imports = { './challenge_wasm_bg.js': {} };
                    const { instance } = await WebAssembly.instantiateStreaming(fetch(wasmUrl), imports);
                    wasm = instance.exports;
                    self.postMessage({ type: 'ready', workerId });
                } else if (type === 'solve') {
                    const nonce = solve(new Uint8Array(randomData), difficulty, BigInt(startNonce), BigInt(step));
                    self.postMessage({ type: 'found', workerId, nonce: nonce.toString() });
                }
            } catch (err) {
                self.postMessage({ type: 'error', workerId, error: err.message });
            }
        };`;

    function start() {
        const challenge = window.ANUBIS_CHALLENGE;
        if (!challenge) return ui.error('Challenge data not found.');
        const { id, randomData, difficulty } = challenge;
        if (!id || !randomData || typeof difficulty !== 'number') return ui.error('Invalid challenge data.');

        const cores = Number.isInteger(navigator.hardwareConcurrency) && navigator.hardwareConcurrency > 0
            ? navigator.hardwareConcurrency
            : 4;
        const count = Math.max(1, Math.ceil(cores / 2));
        const wasmUrl = location.origin + '/.within.website/x/cmd/anubis/api/solver.wasm';
        const blobUrl = URL.createObjectURL(new Blob([workerCode], { type: 'application/javascript' }));
        const workers = [];
        let ready = 0, solved = false, started = 0, timer = null;
        const seconds = () => (performance.now() - started) / 1000;

        function stop() {
            workers.forEach(w => w.terminate());
            clearInterval(timer);
            URL.revokeObjectURL(blobUrl);
        }
        function fail(text) {
            stop();
            ui.error(text);
        }

        for (let i = 0; i < count; i++) {
            const worker = new Worker(blobUrl);
            worker.onmessage = function (e) {
                const { type, workerId, nonce, error } = e.data;
                if (type === 'ready' && ++ready === count) {
                    ui.ready(count);
                    started = performance.now();
                    const rate = HASHES_PER_SECOND * count / 16 ** difficulty;
                    timer = setInterval(() => ui.tick(Math.min(.99, 1 - Math.exp(-seconds() * rate)), seconds()), 100);
                    workers.forEach((w, idx) => w.postMessage({
                        type: 'solve', workerId: idx, randomData: Array.from(randomData),
                        difficulty, startNonce: idx, step: count,
                    }));
                } else if (type === 'found' && !solved) {
                    solved = true;
                    stop();
                    ui.found(workerId, seconds());
                    const passUrl = new URL('/.within.website/x/cmd/anubis/api/pass-challenge', location.origin);
                    passUrl.searchParams.set('id', id);
                    passUrl.searchParams.set('nonce', nonce);
                    passUrl.searchParams.set('redir', location.pathname + location.search);
                    location.href = passUrl.toString();
                } else if (type === 'error') {
                    fail('Error: ' + error);
                }
            };
            worker.onerror = err => fail('Error: ' + err.message);
            workers.push(worker);
        }
        workers.forEach((w, i) => w.postMessage({ type: 'init', workerId: i, wasmUrl }));
    }

    start();
})();
</script>
</body>
</html>
