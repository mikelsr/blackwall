[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "blackwall"
path = "src/main.rs"

[dependencies]
server = { path = "../server" }
shared = { path = "../shared" }

axum = "0.8.8"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
clap = { version = "4.5.60", features = ["derive", "env"] }
dotenvy = "0.15.7"
