[package]
name = "proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
axum = "0.8.8"
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27.7", features = ["http1", "http2", "tls12", "ring", "logging", "webpki-roots"] }
url = "2.5.8"
hyper = "1.8.1"
rustls = "0.23.37"
tower = "0.5.3"
smallvec = "1.15.1"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
axum-extra = { version = "0.12.5", features = ["cookie"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
serde = { version = "1.0.228", features = ["derive", "std"] }
const-str = "1.1.0"
serde_json = "1.0.149"
uuid = { version = "1.22.0", features = ["v7"] }
rand = "0.10.0"
bytes = "1.11.1"
compact_str = { version = "0.9.0", features = ["std", "serde"] }
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "rand_core"] }
tower-http = { version = "0.6.8", features = ["trace"] }
sha2 = "0.11.0"
hex = "0.4.3"
flate2 = "1.1.9"

[dev-dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }

[lib]
doctest = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rust_analyzer)'] }
